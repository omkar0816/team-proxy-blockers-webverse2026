<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Companion - Login & Signup</title>
    <script>
        window.location.replace('/index.html');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #020307 0%, #09020f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgb(15, 3, 3);
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #3d2c2c;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }

        .form-content {
            padding: 40px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .success-msg {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .success-msg.show {
            display: block;
        }

        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-msg.show {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 400;
        }

        .brand-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .brand-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .brand-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .password-strength {
            display: none;
            margin-top: 8px;
            font-size: 12px;
            padding: 5px;
            border-radius: 4px;
        }

        .password-strength.weak {
            display: block;
            background-color: #fee;
            color: #c33;
        }

        .password-strength.medium {
            display: block;
            background-color: #fef3cd;
            color: #856404;
        }

        .password-strength.strong {
            display: block;
            background-color: #d4edda;
            color: #155724;
        }

        @media (max-width: 600px) {
            .form-content {
                padding: 25px;
            }

            .brand-header h1 {
                font-size: 24px;
            }

            input, select {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <h1>🧠 Care Companion</h1>
            <p>Cognitive Care for Elderly</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div class="form-content">
            <!-- Login Form -->
            <div id="login" class="tab-content active">
                <div class="error-msg" id="loginErrorMsg"></div>
                <div class="success-msg" id="loginSuccessMsg"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginUsername">Caretaker Name</label>
                        <input 
                            type="text" 
                            id="loginUsername" 
                            name="caretaker_name"
                            placeholder="Enter caretaker name"
                            required
                        >
                        <div class="error" id="loginUsernameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            name="password"
                            placeholder="Enter password"
                            required
                        >
                        <div class="error" id="loginPasswordError"></div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" name="remember_me">
                        <label for="rememberMe">Remember me</label>
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">Login</button>
                </form>

                <p style="margin-top: 20px; text-align: center; color: #666; font-size: 14px;">
                    Demo Credentials:<br>
                    <strong>Username:</strong> F25211020<br>
                    <strong>Password:</strong> demo123
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signup" class="tab-content">
                <div class="error-msg" id="signupErrorMsg"></div>
                <div class="success-msg" id="signupSuccessMsg"></div>

                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="patientName">Patient Name</label>
                        <input 
                            type="text" 
                            id="patientName" 
                            name="patient_name"
                            placeholder="Enter patient name"
                            required
                        >
                        <div class="error" id="patientNameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="caretakerName">Caretaker Name</label>
                        <input 
                            type="text" 
                            id="caretakerName" 
                            name="caretaker_name"
                            placeholder="Enter caretaker name"
                            required
                        >
                        <div class="error" id="caretakerNameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="caretakerMobile">Mobile Number (10 digits)</label>
                        <input 
                            type="tel" 
                            id="caretakerMobile" 
                            name="caretaker_mobile"
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            required
                        >
                        <div class="error" id="caretakerMobileError"></div>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            name="password"
                            placeholder="Min 6 characters"
                            onchange="checkPasswordStrength()"
                            required
                        >
                        <div class="password-strength" id="passwordStrength"></div>
                        <div class="error" id="signupPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirm_password"
                            placeholder="Confirm password"
                            required
                        >
                        <div class="error" id="confirmPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="language">Preferred Language</label>
                        <select id="language" name="language" required>
                            <option value="English">English</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Marathi">Marathi</option>
                            <option value="Tamil">Tamil</option>
                            <option value="Telugu">Telugu</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="voiceHelper">Voice Helper Language</label>
                        <select id="voiceHelper" name="voice_helper" required>
                            <option value="English">English</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Marathi">Marathi</option>
                            <option value="Tamil">Tamil</option>
                            <option value="Telugu">Telugu</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn" id="signupBtn">Sign Up</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/auth-utils.js"></script>
    <script>
        // Tab switching
        function switchTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Password strength checker
        function checkPasswordStrength() {
            const password = document.getElementById('signupPassword').value;
            const strength = PasswordUtils.getStrength(password);
            const strengthEl = document.getElementById('passwordStrength');
            const label = PasswordUtils.getStrengthLabel(strength);

            strengthEl.classList.remove('weak', 'medium', 'strong');
            
            if (strength <= 1) {
                strengthEl.textContent = 'Password is too weak';
                strengthEl.classList.add('weak');
            } else if (strength === 2) {
                strengthEl.textContent = 'Password is weak';
                strengthEl.classList.add('weak');
            } else if (strength === 3) {
                strengthEl.textContent = 'Password strength: Medium';
                strengthEl.classList.add('medium');
            } else {
                strengthEl.textContent = 'Password strength: Strong';
                strengthEl.classList.add('strong');
            }
        }

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Clear previous messages
            document.getElementById('loginErrorMsg').classList.remove('show');
            document.getElementById('loginSuccessMsg').classList.remove('show');

            // Validate
            if (!username || !password) {
                showLoginError('Please fill in all fields');
                return;
            }

            // Set loading state
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.textContent = 'Logging in...';

            try {
                const result = await window.authManager.login(username, password);

                if (result.success) {
                    if (rememberMe) {
                        localStorage.setItem('rememberedUser', JSON.stringify(result.user));
                    }

                    showLoginSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                }
            } catch (error) {
                showLoginError(error.message || 'Login failed');
                btn.classList.remove('loading');
                btn.textContent = 'Login';
            }
        }

        // Signup handler
        async function handleSignup(event) {
            event.preventDefault();

            const formData = {
                patient_name: document.getElementById('patientName').value.trim(),
                caretaker_name: document.getElementById('caretakerName').value.trim(),
                caretaker_mobile: document.getElementById('caretakerMobile').value.trim(),
                password: document.getElementById('signupPassword').value,
                confirm_password: document.getElementById('confirmPassword').value,
                language: document.getElementById('language').value,
                voice_helper: document.getElementById('voiceHelper').value
            };

            // Clear previous messages
            document.getElementById('signupErrorMsg').classList.remove('show');
            document.getElementById('signupSuccessMsg').classList.remove('show');

            // Validate
            const validation = FormValidator.validateForm(formData);
            if (!validation.isValid) {
                displaySignupErrors(validation.errors);
                return;
            }

            // Check password match
            if (formData.password !== formData.confirm_password) {
                showSignupError('Passwords do not match');
                return;
            }

            // Set loading state
            const btn = document.getElementById('signupBtn');
            btn.classList.add('loading');
            btn.textContent = 'Creating account...';

            try {
                const result = await window.authManager.register(formData);

                if (result.success) {
                    showSignupSuccess('Account created successfully! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                }
            } catch (error) {
                showSignupError(error.message || 'Signup failed');
                btn.classList.remove('loading');
                btn.textContent = 'Sign Up';
            }
        }

        // Helper functions
        function showLoginError(message) {
            const el = document.getElementById('loginErrorMsg');
            el.textContent = message;
            el.classList.add('show');
        }

        function showLoginSuccess(message) {
            const el = document.getElementById('loginSuccessMsg');
            el.textContent = message;
            el.classList.add('show');
        }

        function showSignupError(message) {
            const el = document.getElementById('signupErrorMsg');
            el.textContent = message;
            el.classList.add('show');
        }

        function showSignupSuccess(message) {
            const el = document.getElementById('signupSuccessMsg');
            el.textContent = message;
            el.classList.add('show');
        }

        function displaySignupErrors(errors) {
            Object.keys(errors).forEach(field => {
                const errorEl = document.getElementById(`${field}Error`);
                if (errorEl) {
                    errorEl.textContent = errors[field];
                    errorEl.classList.add('show');
                }
            });
        }

        // Initialize on page load
        window.addEventListener('load', async () => {
            await window.authManager.initialize();
            
            // If already logged in, redirect to dashboard
            if (window.authManager.isAuthenticated()) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
