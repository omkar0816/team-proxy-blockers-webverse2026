<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Care Companion - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      display: flex;
      min-height: 600px;
    }

    /* Left side - Brand/Info */
    .auth-brand {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .brand-logo {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .brand-subtitle {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .brand-features {
      font-size: 12px;
      text-align: left;
      opacity: 0.85;
    }

    .brand-features li {
      margin: 8px 0;
      list-style: none;
      padding-left: 20px;
      position: relative;
    }

    .brand-features li:before {
      content: "✓";
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    /* Right side - Form */
    .auth-form-container {
      flex: 1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
    }

    .auth-tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      background: none;
      border: none;
    }

    .auth-tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .auth-tab:hover {
      color: #667eea;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-row-full {
      grid-column: 1 / -1;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      font-size: 13px;
      color: #666;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .error-message {
      background-color: #fee;
      border: 1px solid #fcc;
      border-radius: 8px;
      color: #c33;
      padding: 12px 15px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background-color: #efe;
      border: 1px solid #cfc;
      border-radius: 8px;
      color: #3c3;
      padding: 12px 15px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .info-text {
      font-size: 13px;
      color: #999;
      margin-top: 15px;
      text-align: center;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .auth-container {
        flex-direction: column;
        min-height: auto;
      }

      .auth-brand {
        padding: 30px 20px;
        min-height: 200px;
      }

      .auth-form-container {
        padding: 30px 20px;
      }

      .brand-title {
        font-size: 24px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Left side - Brand -->
    <div class="auth-brand">
      <div class="brand-logo">🧠</div>
      <div class="brand-title">Care Companion</div>
      <div class="brand-subtitle">
        AI-powered cognitive care for elderly in rural communities
      </div>
      <ul class="brand-features">
        <li>Adaptive brain games</li>
        <li>AI-generated content</li>
        <li>Multi-language support</li>
        <li>Caregiver dashboard</li>
      </ul>
    </div>

    <!-- Right side - Form -->
    <div class="auth-form-container">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="form-section active">
        <div class="error-message" id="loginError"></div>
        
        <div class="form-group">
          <label for="loginName">Caretaker Name</label>
          <input 
            type="text" 
            id="loginName" 
            placeholder="Enter your name" 
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="Enter your password" 
            required
          />
        </div>

        <div class="checkbox-group">
          <input 
            type="checkbox" 
            id="rememberMe" 
            name="rememberMe"
          />
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit" class="btn-submit">Login</button>
        <div class="info-text">Don't have an account? Switch to Sign Up tab</div>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="form-section">
        <div class="error-message" id="signupError"></div>
        <div class="success-message" id="signupSuccess"></div>

        <div class="form-row">
          <div class="form-group form-row-full">
            <label for="signupPatientName">Patient Name *</label>
            <input 
              type="text" 
              id="signupPatientName" 
              placeholder="Enter patient's name" 
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signupCaretakerName">Caretaker Name *</label>
            <input 
              type="text" 
              id="signupCaretakerName" 
              placeholder="Your name" 
              required
            />
          </div>

          <div class="form-group">
            <label for="signupCaretakerMobile">Mobile Number *</label>
            <input 
              type="tel" 
              id="signupCaretakerMobile" 
              placeholder="10-digit mobile" 
              pattern="[0-9]{10}"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signupPassword">Password *</label>
            <input 
              type="password" 
              id="signupPassword" 
              placeholder="Min 6 characters" 
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password *</label>
            <input 
              type="password" 
              id="signupConfirmPassword" 
              placeholder="Re-enter password" 
              minlength="6"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signupLanguage">Language Preference *</label>
            <select id="signupLanguage" required>
              <option value="">Select language</option>
              <option value="hindi">Hindi</option>
              <option value="english">English</option>
              <option value="marathi">Marathi</option>
              <option value="bengali">Bengali</option>
            </select>
          </div>

          <div class="form-group">
            <label for="signupVoiceHelper">Voice Helper</label>
            <select id="signupVoiceHelper">
              <option value="hindi">Hindi</option>
              <option value="english">English</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
        <div class="info-text">Already have an account? Switch to Login tab</div>
      </form>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        
        // Update active tab
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // Update active form
        document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
        document.getElementById(tabName + 'Form').classList.add('active');
        
        // Clear messages
        document.querySelectorAll('.error-message, .success-message').forEach(msg => {
          msg.classList.remove('show');
          msg.textContent = '';
        });
      });
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('loginName').value;
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const errorDiv = document.getElementById('loginError');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;

      try {
        // Validate
        if (!name || !password) {
          throw new Error('Please fill all fields');
        }

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span>Logging in...';

        // Simulate API call (replace with actual backend call)
        const userData = await authenticateUser(name, password);

        if (userData) {
          // Store session
          sessionStorage.setItem('currentUser', JSON.stringify(userData));
          if (rememberMe) {
            localStorage.setItem('rememberedUser', JSON.stringify({
              name: userData.caretaker_name,
              patientName: userData.patient_name
            }));
          }

          // Redirect to dashboard
          window.location.href = '/patient.html';
        } else {
          throw new Error('Invalid credentials');
        }
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    // Signup form
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = {
        patient_name: document.getElementById('signupPatientName').value,
        caretaker_name: document.getElementById('signupCaretakerName').value,
        caretaker_mobile: document.getElementById('signupCaretakerMobile').value,
        password: document.getElementById('signupPassword').value,
        confirm_password: document.getElementById('signupConfirmPassword').value,
        language: document.getElementById('signupLanguage').value,
        voice_helper: document.getElementById('signupVoiceHelper').value
      };

      const errorDiv = document.getElementById('signupError');
      const successDiv = document.getElementById('signupSuccess');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;

      try {
        // Clear messages
        errorDiv.classList.remove('show');
        successDiv.classList.remove('show');

        // Validation
        if (!formData.patient_name) throw new Error('Patient name is required');
        if (!formData.caretaker_name) throw new Error('Caretaker name is required');
        if (!formData.caretaker_mobile || formData.caretaker_mobile.length !== 10) {
          throw new Error('Valid 10-digit mobile number required');
        }
        if (formData.password.length < 6) throw new Error('Password must be at least 6 characters');
        if (formData.password !== formData.confirm_password) {
          throw new Error('Passwords do not match');
        }
        if (!formData.language) throw new Error('Please select a language');

        // Show loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span>Creating account...';

        // Simulate API call (replace with actual backend call)
        const result = await registerUser(formData);

        if (result.success) {
          successDiv.textContent = 'Account created successfully! Logging you in...';
          successDiv.classList.add('show');

          // Auto login and redirect
          setTimeout(() => {
            window.location.href = '/patient.html';
          }, 800);
        } else {
          throw new Error(result.message || 'Registration failed');
        }
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    function storeSession(data, rememberMe = false) {
      sessionStorage.setItem('currentUser', JSON.stringify(data.user));
      sessionStorage.setItem('authToken', data.token);

      if (rememberMe) {
        localStorage.setItem('rememberedUser', JSON.stringify({
          name: data.user.caretaker_name,
          patientName: data.user.patient_name
        }));
      } else {
        localStorage.removeItem('rememberedUser');
      }
    }

    async function authenticateUser(name, password) {
      const response = await fetch('/api/patient/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ caretaker_name: name, password })
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Login failed');
      }

      storeSession(data, document.getElementById('rememberMe').checked);
      return data.user;
    }

    async function registerUser(formData) {
      const response = await fetch('/api/patient/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Registration failed');
      }

      storeSession(data);
      return data;
    }

    // Check if user was remembered
    window.addEventListener('load', () => {
      const remembered = localStorage.getItem('rememberedUser');
      if (remembered) {
        const user = JSON.parse(remembered);
        document.getElementById('loginName').value = user.name;
        document.getElementById('rememberMe').checked = true;
      }
    });
  </script>
</body>
</html>
